<header class="encabezado">
  <div class="container barra">
    <a class="marca" href="#inicio" aria-label="{{ nombre }}, volver al inicio" (click)="cerrarMenu()">
      <span class="marca-icono" aria-hidden="true">
        <span class="material-symbols-outlined">straighten</span>
      </span>
      <span class="marca-texto">
        <strong>{{ nombre }}</strong>
        <small>COSTURA &amp; SASTRERÍA</small>
      </span>
    </a>

    <nav id="menu-principal" class="menu" [class.abierto]="menuAbierto">
      <a href="#servicios" (click)="cerrarMenu()">Servicios</a>
      <a href="#contacto" (click)="cerrarMenu()">Contacto</a>
      <a class="menu-cta" href="#contacto" (click)="cerrarMenu()">Cotizar ahora <span aria-hidden="true">↗</span></a>
    </nav>

    <div class="barra-acciones">
      <a
        class="acceso"
        [routerLink]="rutaAcceso()"
        [attr.aria-label]="etiquetaAcceso() + ' del taller'"
        (click)="cerrarMenu()">
        <span class="material-symbols-outlined" aria-hidden="true">{{ iconoAcceso() }}</span>
        <span class="acceso-texto">{{ etiquetaAcceso() }}</span>
      </a>

      <button
        class="boton-menu"
        type="button"
        aria-controls="menu-principal"
        [attr.aria-expanded]="menuAbierto"
        [attr.aria-label]="menuAbierto ? 'Cerrar menú' : 'Abrir menú'"
        (click)="alternarMenu()">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
  <div class="tape" aria-hidden="true"></div>
</header>
