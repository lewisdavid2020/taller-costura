<header class="site-header">
  <nav class="wrap nav" aria-label="Navegación principal">
    <a class="logo" href="#inicio" [attr.aria-label]="nombre + ', volver al inicio'" (click)="cerrarMenu()">
      <span class="logo-nombre">
        @if (partesNombre.length > 1) {
          {{ partesNombre[0] }} <span class="amp">&amp;</span> {{ partesNombre[1] }}
        } @else {
          {{ nombre }}
        }
      </span>
      <span class="logo-lema">Sastrería a medida</span>
    </a>

    <ul id="menu-principal" class="links" [class.abierto]="menuAbierto">
      <li><a href="#servicios" (click)="cerrarMenu()">Servicios</a></li>
      <li><a routerLink="/productos" (click)="cerrarMenu()">Productos</a></li>
      <li><a href="#proceso" (click)="cerrarMenu()">Proceso</a></li>
      <li><a href="#taller" (click)="cerrarMenu()">El taller</a></li>
      <li><a href="#tarifas" (click)="cerrarMenu()">Tarifas</a></li>
      <li><a href="#contacto" (click)="cerrarMenu()">Contacto</a></li>
    </ul>

    <div class="nav-acciones">
      <a
        class="btn ghost sm acceso"
        [routerLink]="rutaAcceso()"
        [attr.aria-label]="etiquetaAcceso() + ' del taller'"
        (click)="cerrarMenu()">{{ etiquetaAcceso() }}</a>

      <button
        class="menu-btn"
        type="button"
        aria-controls="menu-principal"
        [attr.aria-expanded]="menuAbierto"
        [attr.aria-label]="menuAbierto ? 'Cerrar menú' : 'Abrir menú'"
        (click)="alternarMenu()">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>
</header>
