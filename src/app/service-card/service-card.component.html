<article class="card">
  <span class="card-num" aria-hidden="true">{{ numero < 10 ? '0' : '' }}{{ numero }}</span>
  <span class="icon material-symbols-outlined" aria-hidden="true">{{ icono }}</span>
  <h3 class="serif">{{ titulo }}</h3>
  <p>{{ descripcion }}</p>

  <ul>
    @for (beneficio of beneficios; track beneficio) {
      <li>{{ beneficio }}</li>
    }
  </ul>

  <div class="price-row">
    <span class="price">
      {{ etiqueta }}
      <b>{{ precio }}</b>
    </span>
    <a class="btn ghost sm" href="#contacto">Cotizar</a>
  </div>
</article>
